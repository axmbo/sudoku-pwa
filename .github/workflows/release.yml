# Casca fina: a lógica vive em `scripts/ci/*` (ADR 0006, runbook de assinatura, etapa 7).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false # repo público: o fetch da tag não precisa de token
      # O checkout pode reescrever a tag anotada como leve: busca a tag original.
      - name: Busca a tag anotada original
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
      # Só chaves de hardware (sk-) assinam release; a lista vem da main, nunca do commit da tag.
      - name: Obtém allowed_signers_tags da main
        # Se faltar, o script ainda recusa tag leve ou sem assinatura e depois falha pela ausência.
        run: |
          git show origin/main:.github/allowed_signers_tags > "$RUNNER_TEMP/allowed_signers_tags" \
            || echo "Aviso: .github/allowed_signers_tags ausente na main." >&2
      # O histórico completo (fetch-depth: 0) permite o merge-base contra origin/main.
      - name: Verifica nome, origem e assinatura da tag
        run: bash scripts/ci/verify-tag.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/allowed_signers_tags" origin/main

  # Build, proveniência e deploy entram com o primeiro release; dependerão de `verify-tag`.
